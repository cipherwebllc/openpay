name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # actions/checkout@v4 等の JS-based action 自体を Node.js 24 で実行させる。
  # GitHub は 2026-06-02 から Node.js 20 を deprecate (動作はするが warning)、
  # 2026-09-16 に完全停止。設定なしだと CI ログに deprecation warning が出続ける。
  # この env は action runtime のみに作用し、setup-node@v4 で指定する node-version
  # (我々の test runtime) には影響しない。
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # 依存の取得元 gate (2026-07-20 採用): 全 package-lock.json が公式 npm
      # レジストリのみから解決されていることを検査。git URL / 独自レジストリ /
      # http 取得の混入 (AI エージェント経由のサプライチェーン汚染含む) で fail。
      # .npmrc の redirect は npm ci が読む前に止める (Node 標準 API + Git のみ)。
      - run: node scripts/lockfile-gate.mjs
      - run: npm ci
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm run typecheck
      # Next build の lint 対象外 (hooks/tests/scripts/e2e/instrumentation 等) も含め、
      # bypass 可能な pre-commit hook に依存せずリポ全体を機械的に検査する。
      - run: npm run lint
      # JST ホストではローカル日付への退行を検出できないため、起動前に非 JST の TZ を固定。
      - name: JST date regressions (non-JST host)
        env:
          TZ: America/Los_Angeles
        run: >-
          npx vitest run --no-cache
          tests/lib/shopTime.test.ts
          tests/lib/freeeSync.test.ts
          tests/lib/accountingCsv.test.ts
          tests/lib/lineItemsCsv.test.ts
          tests/app/store-seller-disclosure.test.tsx
          tests/components/X402DiscoveryView.test.tsx
      # scripts/run-tests.mjs は vitest を forks pool / maxForks=2 で起動し、
      # JSON reporter の numFailedTests を真の合否ソースとして使う。
      # assertion の外の未処理エラー (worker の異常終了 "Worker exited unexpectedly" を含む) は
      # scripts/lib/unhandledErrorsReporter.mjs が数えて fail にする (第 7 回レビュー #759)。かつての
      # PaymentForm 系の post-teardown OOM は 2026-06-03 に真因を直したので通さない。再発したら真因を調べる
      # (continue-on-error に戻さない)。
      # 本物の Lua (wasmoon) を使う test は非決定的に WASM heap が壊れる (memory:
      # feedback_wasmoon_oob_flaky) ので外し lua-real job に任せる (2026-09-12 案 1)。
      # 除外一覧は scripts/lib/luaRealTests.mjs が単一情報源 (run-tests.mjs が --exclude を付ける)。
      # カバレッジは gate (2026-09-02)。full vitest は coverage 付きの 1 回だけ走らせ (第 7 回レビュー E13・
      # 以前は coverage なしと coverage ありの 2 回)、下限 (scripts/lib/coverageThresholds.mjs) は run-tests.mjs が
      # coverage-summary.json と比べて fail させる (実測 -2pt・割れたら「テストの無い分岐が増えた」の合図)。
      - name: Tests + coverage
        run: node scripts/run-tests.mjs
        env:
          SKIP_LUA_REAL: '1'
          RUN_TESTS_COVERAGE: '1'
      # 売り手が自分のサーバーで使う SDK の保護配布 verifier・license gate の node:test (vitest の include の外)。
      # ここで走らせないと SDK を変えても壊れたまま CI が green になる (第 7 回レビュー F16)。依存は root の node_modules。
      - name: SDK tests (node:test)
        run: npm --prefix packages/x402-sdk test
      - name: Build (production) + bundle budget check
        env:
          NEXT_PUBLIC_NETWORK_ENV: testnet
          NEXT_PUBLIC_PIMLICO_API_KEY: ci_dummy_key
          NEXT_PUBLIC_FEE_RECEIVER_ADDRESS: '0x000000000000000000000000000000000000dEaD'
        run: |
          # build の失敗を tee の終了コードで隠さない (pipefail が無いと予算スクリプトのパース失敗頼みになる・第 7 回レビュー E12)
          set -o pipefail
          # build ログを保存して、後で bundle 予算チェックに食わせる
          npm run build 2>&1 | tee build.log
          # Route 別 First Load JS の予算超過を fail させる
          node scripts/check-bundle-budget.mjs < build.log
          # サーバーバンドル内の Lua (EVAL 用 CAS) が minifier に壊されていないか (2026-09-06 実害)
          node scripts/check-lua-bundle.mjs

  # 本物の Lua (wasmoon) を使う 4 file だけを、プロセスを作り直しながら最大 3 回まで実行する。
  # test job から分離した理由・一覧は scripts/lib/luaRealTests.mjs。ここが 3 回とも落ちたら
  # flaky ではなく本当の回帰 (or flaky の悪化) として扱う。
  lua-real:
    runs-on: ubuntu-latest
    # 3 attempt × 10 分 (scripts/run-lua-tests.mjs の attempt timeout) + npm ci の余裕。
    # 2026-09-12 に worker 無応答で 74 分ぶら下がった実害があるため job 側にも上限を置く。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/lockfile-gate.mjs
      - run: npm ci
      - run: node scripts/run-lua-tests.mjs

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # lockfile と .npmrc の取得元を、npm のネットワークアクセスより前に検査する。
      - run: node scripts/lockfile-gate.mjs
      # MODERATE / HIGH / CRITICAL の advisory gate。scripts/audit-gate.mjs は
      # 受容済 advisory を allowlist で許容し、それ以外の MODERATE+ で fail
      # させる。受容済の根拠は docs/DEPLOY_CHECKLIST.md §7、allowlist 本体は
      # scripts/audit-gate.mjs の ALLOWED_ADVISORIES。新規 advisory 出現時は
      # 監査 trail として両者を同時 update して PR レビューする運用。
      # (旧: HIGH+ のみ gate、moderate は warning。2026-05-22 に moderate も
      # gating へ昇格させ、新規 moderate を必ず人が評価する policy に変更)
      - run: node scripts/audit-gate.mjs
