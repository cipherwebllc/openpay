name: e2e (Playwright)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # GitHub Actions の Node.js 20 deprecation 対策 (詳細は ci.yml の同 env block 参照)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  playwright:
    # ubuntu-latest は 2026-10-24 に Ubuntu 26.04 へ移り、Playwright 1.59 は 26.04 の chromium を入れられない
    # ("Playwright does not support chromium on ubuntu26.04-x64")。26.04 に対応した Playwright へ上げるまで 24.04 に固定する。
    runs-on: ubuntu-24.04
    # chromium+webkit の 2 ブラウザ suite が 20 分に収まらず cancelled していたため 30 分へ。
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_NETWORK_ENV: testnet
      NEXT_PUBLIC_PIMLICO_API_KEY: dummy_for_build
      NEXT_PUBLIC_PIMLICO_SPONSORSHIP_POLICY_ID: sp_dummy
      NEXT_PUBLIC_FEE_RECEIVER_ADDRESS: '0x000000000000000000000000000000000000dEaD'
      NEXT_PUBLIC_JPYC_TESTNET_ADDRESS: '0x0000000000000000000000000000000000000abc'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true # ランナーの cache の版が古い (セキュリティ修正前) ままでも、22 系の最新を使う
          cache: npm

      - name: Check dependency sources
        run: node scripts/lockfile-gate.mjs

      - name: Install
        run: npm ci --ignore-scripts

      # install script は走らせずに入れ、gate が実体を走査して allowlist 外なら fail、通ったら allowlist の名前だけ
      # npm rebuild する (CLAUDE.md 掟 16・docs/DEPLOY_CHECKLIST.md §7.14)。
      - name: Check installed packages for install-time scripts and rebuild the allowlisted ones
        run: node scripts/installed-scripts-gate.mjs --rebuild node_modules

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Build
        run: npm run build

      - name: Run e2e
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-prodflags:
    # playwright job と同じ理由で 24.04 に固定する。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Fail the job on regressions, including smoke failures (no advisory override).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true # ランナーの cache の版が古い (セキュリティ修正前) ままでも、22 系の最新を使う
          cache: npm

      - name: Check dependency sources
        run: node scripts/lockfile-gate.mjs

      - name: Install
        run: npm ci --ignore-scripts

      # install script は走らせずに入れ、gate が実体を走査して allowlist 外なら fail、通ったら allowlist の名前だけ
      # npm rebuild する (CLAUDE.md 掟 16・docs/DEPLOY_CHECKLIST.md §7.14)。
      - name: Check installed packages for install-time scripts and rebuild the allowlisted ones
        run: node scripts/installed-scripts-gate.mjs --rebuild node_modules

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Load public production flags (testnet fixtures)
        # One vector supplies BOTH the build and the server/test process.
        run: sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' e2e/prodFlags.env >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Run production-flag smoke and fee rows (timed)
        run: time ./node_modules/.bin/playwright test --config=playwright.prodflags.config.ts

      - name: Upload production-flag report and durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-prodflags-report
          path: playwright-prodflags-report/
          retention-days: 7
