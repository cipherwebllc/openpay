name: e2e (Playwright)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # GitHub Actions の Node.js 20 deprecation 対策 (詳細は ci.yml の同 env block 参照)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  playwright:
    # ubuntu-latest は 2026-10-24 に Ubuntu 26.04 へ移り、Playwright 1.59 は 26.04 の chromium を入れられない
    # ("Playwright does not support chromium on ubuntu26.04-x64")。26.04 に対応した Playwright へ上げるまで 24.04 に固定する。
    runs-on: ubuntu-24.04
    # chromium+webkit の 2 ブラウザ suite が 20 分に収まらず cancelled していたため 30 分へ。
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_NETWORK_ENV: testnet
      NEXT_PUBLIC_PIMLICO_API_KEY: dummy_for_build
      NEXT_PUBLIC_PIMLICO_SPONSORSHIP_POLICY_ID: sp_dummy
      NEXT_PUBLIC_FEE_RECEIVER_ADDRESS: '0x000000000000000000000000000000000000dEaD'
      NEXT_PUBLIC_JPYC_TESTNET_ADDRESS: '0x0000000000000000000000000000000000000abc'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true # ランナーの cache の版が古い (セキュリティ修正前) ままでも、22 系の最新を使う
          cache: npm

      - name: Check dependency sources
        run: node scripts/lockfile-gate.mjs

      - name: Install
        run: npm ci --ignore-scripts

      # install script は走らせずに入れ、gate が実体を走査して allowlist 外なら fail、通ったら allowlist の名前だけ
      # npm rebuild する (CLAUDE.md 掟 16・docs/DEPLOY_CHECKLIST.md §7.14)。
      - name: Check installed packages for install-time scripts and rebuild the allowlisted ones
        run: node scripts/installed-scripts-gate.mjs --rebuild node_modules

      # Ubuntu のパッケージ (.deb) を GitHub の cache から戻し、ミラーから取り直さない。2026-11-05〜06 の e2e 120 run で、
      # azure.archive.ubuntu.com からの .deb の取得が約 65 kB/s に落ち、下の install が job の上限まで止まって cancel
      # された回が 7 回あった (この job 5・e2e-prodflags 2)。パッケージの一覧 (apt-get update) は同じミラーから速いまま
      # (12.8 MB を 1 秒) で、遅いのは .deb の取得だけ。遅さは 30 分続いたので、同じ job でやり直しても速くならない。
      # cache の key は「Playwright の版・job 名・.deb の一覧の hash」。戻すときは一覧が前もって分からないので、
      # 版と job 名の prefix で一番新しい cache を戻す。入れ終えたら、今の版で取れなくなった古い .deb を
      # apt-get autoclean で消し、残った一覧が戻した cache と違えば (Ubuntu の更新を取った等) 新しい key で保存する。
      # .deb の置き場から cache に入れるのは .deb だけ (partial/ と lock は apt のもの)。置き場所は /var/cache の下で、
      # 持ち主は runner の利用者 (cache の restore/save が読み書きする)。$HOME の下だと apt の取得用の利用者 _apt が入れず、
      # 取得が root で走っていた (W: Download is performed unsandboxed as root・2026-11-06 の CI)。
      # 2026-11-11 の 14:13〜17:45 UTC は、runner から Ubuntu のパッケージ置き場 (azure.archive・archive・security) の名前が
      # 引けなかった。apt-get update は失敗しても先へ進み、apt は image に入っている古い一覧を使った。cache の .deb は新しい
      # 一覧で選んだ版なので、古い一覧が指す版の 5 個 (WebKit 用) を取りに行って落ちた (main と PR 6 本)。そこで .deb と
      # 一緒に、その .deb を選んだときの一覧 (Dir::State::Lists) も cache に入れる。一覧を取れた日は今までどおり新しい一覧で
      # 入れ、取れない日は apt が cache の一覧を古い一覧として使うので、cache の .deb だけで入れ切れる。key は .deb の一覧の
      # hash のままで、.deb の組が変わらない日は保存しないから、cache の一覧は「その .deb を選んだ日の一覧」のまま残る。
      # 一覧の置き場も /var/cache の下で runner の利用者のもの。cache に入れるのは一覧のファイル (名前に _ が入る) だけで、
      # lock・partial/・auxfiles/ は apt のもの。key の lists1 は cache の中身の形の版 (.deb だけだった頃の cache と分ける)。
      - name: Point apt at a cacheable package directory
        id: apt-cache
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /var/cache/openpay-apt-archives /var/cache/openpay-apt-lists
          mkdir -p /var/cache/openpay-apt-archives/partial /var/cache/openpay-apt-lists/partial
          printf 'Dir::Cache::Archives "%s";\nDir::State::Lists "%s";\nAPT::Keep-Downloaded-Packages "true";\n' /var/cache/openpay-apt-archives /var/cache/openpay-apt-lists | sudo tee /etc/apt/apt.conf.d/99-openpay-apt-cache
          echo "prefix=apt-lists1-ubuntu-24.04-playwright-$(./node_modules/.bin/playwright --version | awk '{print $2}')-job-playwright-" >> "$GITHUB_OUTPUT"

      - name: Restore apt packages
        id: apt-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            /var/cache/openpay-apt-archives/*.deb
            /var/cache/openpay-apt-lists/*_*
          # この key では保存しない (完全一致はさせず、下の restore-keys の prefix で一番新しいものを戻す)。
          key: ${{ steps.apt-cache.outputs.prefix }}restore
          restore-keys: ${{ steps.apt-cache.outputs.prefix }}

      # TEMP・merge の前に消す: Ubuntu のパッケージ置き場 3 つに届かなくして、2026-11-11 の障害の日の動きを確かめる。
      - name: TEMP (merge の前に消す) block the Ubuntu package mirrors
        run: |
          echo "restored: $(find /var/cache/openpay-apt-archives -maxdepth 1 -name '*.deb' | wc -l) .deb, $(find /var/cache/openpay-apt-lists -maxdepth 1 -type f -name '*_*' | wc -l) list files"
          ls -la /var/cache/openpay-apt-lists
          grep -H -E '^(Date|Valid-Until):' /var/lib/apt/lists/*InRelease /var/cache/openpay-apt-lists/*InRelease || true
          echo '0.0.0.0 azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com' | sudo tee -a /etc/hosts
          getent hosts azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Key the apt packages by their file list
        id: apt-list
        env:
          APT_CACHE_PREFIX: ${{ steps.apt-cache.outputs.prefix }}
        run: |
          sudo apt-get autoclean
          echo "apt cache: $(find /var/cache/openpay-apt-archives -maxdepth 1 -name '*.deb' | wc -l) .deb, $(find /var/cache/openpay-apt-lists -maxdepth 1 -type f -name '*_*' | wc -l) list files"
          echo "key=${APT_CACHE_PREFIX}$(find /var/cache/openpay-apt-archives -maxdepth 1 -name '*.deb' -printf '%f\n' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # 入れ終えた時点で保存する (後の e2e が落ちても、取り終えた .deb は次の run で使える)。保存するのは入れ終えた run
      # だけなので、cache の一覧はいつも「その .deb を入れられた一覧」になる (取れずに落ちた run の一覧は保存しない)。
      - name: Save apt packages
        if: steps.apt-list.outputs.key != steps.apt-restore.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            /var/cache/openpay-apt-archives/*.deb
            /var/cache/openpay-apt-lists/*_*
          key: ${{ steps.apt-list.outputs.key }}

      - name: Build
        run: npm run build

      - name: Run e2e
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-prodflags:
    # playwright job と同じ理由で 24.04 に固定する。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Fail the job on regressions, including smoke failures (no advisory override).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true # ランナーの cache の版が古い (セキュリティ修正前) ままでも、22 系の最新を使う
          cache: npm

      - name: Check dependency sources
        run: node scripts/lockfile-gate.mjs

      - name: Install
        run: npm ci --ignore-scripts

      # install script は走らせずに入れ、gate が実体を走査して allowlist 外なら fail、通ったら allowlist の名前だけ
      # npm rebuild する (CLAUDE.md 掟 16・docs/DEPLOY_CHECKLIST.md §7.14)。
      - name: Check installed packages for install-time scripts and rebuild the allowlisted ones
        run: node scripts/installed-scripts-gate.mjs --rebuild node_modules

      # playwright job と同じ理由・同じ作り方で、Ubuntu のパッケージ (.deb) と、それを選んだときの一覧を cache から戻す
      # (key の job 名で分ける)。
      - name: Point apt at a cacheable package directory
        id: apt-cache
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /var/cache/openpay-apt-archives /var/cache/openpay-apt-lists
          mkdir -p /var/cache/openpay-apt-archives/partial /var/cache/openpay-apt-lists/partial
          printf 'Dir::Cache::Archives "%s";\nDir::State::Lists "%s";\nAPT::Keep-Downloaded-Packages "true";\n' /var/cache/openpay-apt-archives /var/cache/openpay-apt-lists | sudo tee /etc/apt/apt.conf.d/99-openpay-apt-cache
          echo "prefix=apt-lists1-ubuntu-24.04-playwright-$(./node_modules/.bin/playwright --version | awk '{print $2}')-job-e2e-prodflags-" >> "$GITHUB_OUTPUT"

      - name: Restore apt packages
        id: apt-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            /var/cache/openpay-apt-archives/*.deb
            /var/cache/openpay-apt-lists/*_*
          key: ${{ steps.apt-cache.outputs.prefix }}restore
          restore-keys: ${{ steps.apt-cache.outputs.prefix }}

      # TEMP・merge の前に消す: Ubuntu のパッケージ置き場 3 つに届かなくして、2026-11-11 の障害の日の動きを確かめる。
      - name: TEMP (merge の前に消す) block the Ubuntu package mirrors
        run: |
          echo "restored: $(find /var/cache/openpay-apt-archives -maxdepth 1 -name '*.deb' | wc -l) .deb, $(find /var/cache/openpay-apt-lists -maxdepth 1 -type f -name '*_*' | wc -l) list files"
          ls -la /var/cache/openpay-apt-lists
          grep -H -E '^(Date|Valid-Until):' /var/lib/apt/lists/*InRelease /var/cache/openpay-apt-lists/*InRelease || true
          echo '0.0.0.0 azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com' | sudo tee -a /etc/hosts
          getent hosts azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Key the apt packages by their file list
        id: apt-list
        env:
          APT_CACHE_PREFIX: ${{ steps.apt-cache.outputs.prefix }}
        run: |
          sudo apt-get autoclean
          echo "apt cache: $(find /var/cache/openpay-apt-archives -maxdepth 1 -name '*.deb' | wc -l) .deb, $(find /var/cache/openpay-apt-lists -maxdepth 1 -type f -name '*_*' | wc -l) list files"
          echo "key=${APT_CACHE_PREFIX}$(find /var/cache/openpay-apt-archives -maxdepth 1 -name '*.deb' -printf '%f\n' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save apt packages
        if: steps.apt-list.outputs.key != steps.apt-restore.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            /var/cache/openpay-apt-archives/*.deb
            /var/cache/openpay-apt-lists/*_*
          key: ${{ steps.apt-list.outputs.key }}

      - name: Load public production flags (testnet fixtures)
        # One vector supplies BOTH the build and the server/test process.
        run: sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' e2e/prodFlags.env >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Run production-flag smoke and fee rows (timed)
        run: time ./node_modules/.bin/playwright test --config=playwright.prodflags.config.ts

      - name: Upload production-flag report and durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-prodflags-report
          path: playwright-prodflags-report/
          retention-days: 7
