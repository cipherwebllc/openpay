# JPYC Activity の手動復旧用。毎時の定期実行は vercel.json の Vercel Cron (毎時 20 分) が担う。
# GitHub の schedule は実測で平均 5.4 時間おき (最長 8.6 時間) にしか動かず、有効期限 4 時間の
# データが期間の 4 割前後で 503 data_stale になっていたため移した (2026-10-05)。二重実行は lease で
# 片方が skipped になるだけだが、Upstash のコマンドを無駄に使うので schedule は置かない。
# finalized バケットの独立保存 + 55 秒 lease で再送可能。必要 secret: CRON_SECRET (Vercel env と同じ値)。
name: jpyc-activity-cron
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger /api/cron/jpyc-activity
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set. jpyc-activity cannot run."
            exit 1
          fi
          # Authenticated bodies contain private diagnostics; never send them to public logs.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 90 \
            https://open-pay.jp/api/cron/jpyc-activity)
          echo "HTTP $code"
          # 401 = secret 不一致 (設定ミスを赤で知らせる)。5xx も失敗扱い。
          if [ "$code" = "200" ]; then
            echo "Cron trigger: accepted"
          else
            echo "Cron trigger: failed"
            exit 1
          fi
