name: kv-backup-watch
on:
  schedule:
    - cron: '47 3,9,15,21 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: kv-backup-watch
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  watch:
    runs-on: ubuntu-latest
    # secrets は environment「main-only」(使えるブランチは main だけ) に置く。repo 単位の secrets は
    # どのブランチの workflow からも読めるため (2026-10 Gheist: 盗んだトークンで新しいブランチに workflow を置いて抜く)。
    # deployment: false = デプロイの記録は作らない。
    environment:
      name: main-only
      deployment: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true # ランナーの cache の版が古い (セキュリティ修正前) ままでも、22 系の最新を使う
      - name: Check latest complete KV backup
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for key in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!key}" ]; then
              echo "::error::$key secret is not set. KV backup watch cannot run."
              exit 1
            fi
          done
          node scripts/kv-backup-watch.mjs
