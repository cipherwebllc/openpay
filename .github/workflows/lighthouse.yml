name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # GitHub Actions の Node.js 20 deprecation 対策 (詳細は ci.yml の同 env block 参照)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Lighthouse は本番ビルドで動かす。テスト環境用の最小 env を渡す。
      NEXT_PUBLIC_NETWORK_ENV: testnet
      NEXT_PUBLIC_PIMLICO_API_KEY: dummy_for_build
      NEXT_PUBLIC_PIMLICO_SPONSORSHIP_POLICY_ID: sp_dummy
      NEXT_PUBLIC_FEE_RECEIVER_ADDRESS: '0x000000000000000000000000000000000000dEaD'
      NEXT_PUBLIC_JPYC_TESTNET_ADDRESS: '0x0000000000000000000000000000000000000abc'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lighthouse/package-lock.json

      # lockfile-gate は tools/lighthouse/package-lock.json (lhci の推移的依存) も検査する。
      - name: Check dependency sources
        run: node scripts/lockfile-gate.mjs

      - name: Install
        run: npm ci

      # npm ci の直後に node_modules の実体 (install script・binding.gyp・link の prepare) を走査する (検出)。
      - name: Check installed packages for install-time scripts
        run: node scripts/installed-scripts-gate.mjs node_modules

      - name: Build
        run: npm run build

      # @lhci/cli は本体の devDependencies に入れず tools/lighthouse の lockfile で固定する
      # (旧: npx --yes @lhci/cli@0.14.0 = 推移的依存を実行のたびに最新解決・掟 16 の gate 外)。
      # lhci の依存に install script は無い (lockfile-gate の allowlist で検査済み) ので、この job では
      # install script を一切走らせない = 依存の侵害が LHCI_GITHUB_APP_TOKEN を持つ step へ波及する経路を断つ。
      - name: Install Lighthouse CI (lockfile)
        run: npm --prefix tools/lighthouse ci --ignore-scripts

      - name: Check installed Lighthouse CI packages for install-time scripts
        run: node scripts/installed-scripts-gate.mjs tools/lighthouse/node_modules

      # autorun (healthcheck → collect → assert → upload) を step に分ける。collect は .lighthouserc.json の
      # `npm run start` でアプリとその依存を同じ env で起動するので、token を持たせない。token は upload
      # (temporary-public-storage への保存 + GitHub の status 投稿) の step だけに渡す。collect が失敗したら以降は
      # 走らず、upload の失敗は autorun と同じく警告止まり (assert の結果が job の verdict)。
      # 残るリスク = 先行 step (npm ci の install script) が同じ runner の後続 step を書き換えうる。完全な隔離は job 分割。
      - name: Lighthouse collect
        run: tools/lighthouse/node_modules/.bin/lhci collect

      - name: Lighthouse upload
        continue-on-error: true
        run: tools/lighthouse/node_modules/.bin/lhci upload
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Lighthouse assert
        run: tools/lighthouse/node_modules/.bin/lhci assert
