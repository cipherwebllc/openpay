name: Pimlico balance alert

on:
  schedule:
    # 6 時間ごと (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

env:
  # GitHub Actions の Node.js 20 deprecation 対策 (詳細は ci.yml の同 env block 参照)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Secrets が 1 つでも欠けていたら scheduled run は graceful skip。
      # workflow_dispatch (手動実行) では明示的に動かしたい意図とみなして実行する。
      # cron トリガで毎回 fail メールを発生させるのを防ぐ。
      - name: Verify secrets configured
        id: secrets
        env:
          PIMLICO_PAYMASTER_POLYGON: ${{ secrets.PIMLICO_PAYMASTER_POLYGON }}
          PIMLICO_PAYMASTER_BASE: ${{ secrets.PIMLICO_PAYMASTER_BASE }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          # Polygon/Base/Webhook は required (script の必須 env)。Kaia は optional —
          # secret 未設定で kaia を skip、ある operator のみ check 対象に含める。
          if [ -z "$PIMLICO_PAYMASTER_POLYGON" ] || [ -z "$PIMLICO_PAYMASTER_BASE" ] || [ -z "$ALERT_WEBHOOK_URL" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Secrets が未設定です (PIMLICO_PAYMASTER_POLYGON / PIMLICO_PAYMASTER_BASE / ALERT_WEBHOOK_URL)。README 'Pimlico 残高アラート設定手順' を参照"
              exit 1
            fi
            echo "::warning::Secrets 未設定のため scheduled run を skip (本番投入前の通常状態)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install (production deps only)
        if: steps.secrets.outputs.skip != 'true'
        # viem だけあれば動く。devDependencies (vitest 等) は不要。
        # --ignore-scripts: prepare script (husky、devDep) を skip して exit 127
        # (sh: husky: not found) を防ぐ。CI で git hooks は不要。
        run: npm ci --omit=dev --ignore-scripts

      - name: Check Pimlico balance
        if: steps.secrets.outputs.skip != 'true'
        env:
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          # Kaia は optional (CHAIN_CONFIGS で required=false)、KAIA_RPC_URL 未設定なら
          # https://public-en.node.kaia.io へフォールバック。PIMLICO_PAYMASTER_KAIA が
          # 未設定なら kaia 自体を skip。
          KAIA_RPC_URL: ${{ secrets.KAIA_RPC_URL }}
          PIMLICO_PAYMASTER_POLYGON: ${{ secrets.PIMLICO_PAYMASTER_POLYGON }}
          PIMLICO_PAYMASTER_BASE: ${{ secrets.PIMLICO_PAYMASTER_BASE }}
          PIMLICO_PAYMASTER_KAIA: ${{ secrets.PIMLICO_PAYMASTER_KAIA }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_THRESHOLD_POL: ${{ vars.ALERT_THRESHOLD_POL }}
          ALERT_THRESHOLD_ETH: ${{ vars.ALERT_THRESHOLD_ETH }}
          ALERT_THRESHOLD_KAIA: ${{ vars.ALERT_THRESHOLD_KAIA }}
        run: node scripts/check-pimlico-balance.mjs
