name: Post-deploy production config verify

# Vercel deploy 完了後の operator env 状況を curl + gh CLI で確認。
# 主目的: Sentry DSN / Pimlico balance cron secrets が prod で active か検証
# (verify-production-config.mjs)。設定漏れがあれば workflow を fail させ、
# operator notification を発火する (GitHub UI / 通知 email)。
#
# 起動 trigger:
#   - main push 後 5 分待機 (Vercel deploy 完了見込み)
#   - 1 日 1 回の cron (deploy 不在でも定期 health check)
#   - workflow_dispatch で operator 手動実行可

on:
  push:
    branches: [main]
  schedule:
    # JST 09:00 = UTC 00:00 (営業時間開始前 daily check)
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  # gh CLI で workflow run 履歴を read する用 (Pimlico cron skip 判定)
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PROD_BASE_URL: 'https://open-pay.jp'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # push trigger の場合、Vercel deploy 完了を 5 分待つ。schedule/manual は待たない。
      - name: Wait for Vercel deploy (push trigger only)
        if: github.event_name == 'push'
        run: sleep 300

      # production smoke (URL-level health)
      - name: Tip production smoke (10 URL)
        run: node scripts/smoke-tip-production.mjs "$PROD_BASE_URL"

      # operator env precondition (Sentry DSN / Pimlico cron active 判定)
      - name: Verify production env config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-production-config.mjs "$PROD_BASE_URL"
