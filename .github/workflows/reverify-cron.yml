# 掲載リソース再検証の予備の毎時トリガー。毎時の主トリガーは vercel.json の Vercel Cron (毎時 0 分・2026-10-30 から)。
# ⚠️ GitHub の schedule は混雑で遅れ・間引きされ、実測は 0.4〜7.4 時間おき (平均 4.4 時間・2026-10-24〜30 の 30 回)。
# これだけに頼ると再検証が最大 7 時間以上止まるので主を Vercel Cron へ移した。こちらは Vercel Cron が止まったときに
# 再検証を途切れさせない予備として残す (毎時は保てない・実測 2〜7 時間おきで追いつく)。
# route 側は runId (UTC 時) + KV lock + 対象ごとの lastRunId で冪等 — 同じ UTC 時の 2 回目は probe せず重複として飛ばす。
# 本番設定の検証 (scripts/verify-production-config-helpers.mjs) は、本番の最後の正常な batch (/api/cron/reverify-status) を
# 3 時間で、この workflow の run 履歴 (secret の不一致の検出) を 8 時間で見る。
# 必要 secret: CRON_SECRET (Vercel env と同じ値を GitHub リポ secret にも登録)。
name: reverify-cron
on:
  schedule:
    - cron: '5 * * * *' # 毎時 5 分 (Vercel Cron の 0 分とずらす)
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  trigger:
    runs-on: ubuntu-latest
    # secrets は environment「main-only」(使えるブランチは main だけ) に置く。repo 単位の secrets は
    # どのブランチの workflow からも読めるため (2026-10 Gheist: 盗んだトークンで新しいブランチに workflow を置いて抜く)。
    # deployment: false = デプロイの記録は作らない。
    environment:
      name: main-only
      deployment: false
    timeout-minutes: 3
    steps:
      - name: Trigger /api/cron/reverify
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set. Hourly reverify cannot run."
            exit 1
          fi
          # Authenticated bodies contain private diagnostics; never send them to public logs.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 90 \
            https://open-pay.jp/api/cron/reverify)
          echo "HTTP $code"
          # 401 = secret 不一致 (設定ミスを赤で知らせる)。5xx も失敗扱い。
          if [ "$code" = "200" ]; then
            echo "Cron trigger: accepted"
          else
            echo "Cron trigger: failed"
            exit 1
          fi
