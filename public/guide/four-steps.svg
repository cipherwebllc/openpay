<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="1100" height="280" role="img" aria-label="会計→QR表示→スキャン→完了確認 の4ステップ">
  <style>text{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;}</style>
  <rect width="1100" height="280" fill="#ffffff"/>
  <line x1="170" y1="78" x2="930" y2="78" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round"/>
  <!-- step 1 -->
  <circle cx="170" cy="78" r="34" fill="#059669"/>
  <text x="170" y="89" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="55" y="140" width="230" height="94" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="170" y="178" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">レジで会計し</text>
  <text x="170" y="204" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">「OpenPay」を選択</text>
  <!-- step 2 -->
  <circle cx="420" cy="78" r="34" fill="#059669"/>
  <text x="420" y="89" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="305" y="140" width="230" height="94" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="420" y="178" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">同じ金額で</text>
  <text x="420" y="204" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">QR を表示</text>
  <!-- step 3 -->
  <circle cx="670" cy="78" r="34" fill="#059669"/>
  <text x="670" y="89" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="555" y="140" width="230" height="94" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="670" y="178" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">お客様が</text>
  <text x="670" y="204" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">QR をスキャン</text>
  <!-- step 4 -->
  <circle cx="920" cy="78" r="34" fill="#10b981"/>
  <path d="M905 78 l10 11 l19 -22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="805" y="140" width="230" height="94" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="920" y="178" font-size="17" font-weight="700" fill="#047857" text-anchor="middle">「支払い完了」を</text>
  <text x="920" y="204" font-size="17" font-weight="700" fill="#047857" text-anchor="middle">確認して締める</text>
</svg>
