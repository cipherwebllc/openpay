<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="POSの明細とOpenPayの履歴/CSVを金額・番号で突き合わせる図">
  <style>text{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;}</style>
  <rect width="1000" height="420" fill="#ffffff"/>
  <!-- center match label -->
  <rect x="350" y="30" width="300" height="40" rx="20" fill="#f1f5f9"/>
