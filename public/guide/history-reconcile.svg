  <g>
    <rect x="608" y="178" width="324" height="50" rx="8" fill="#ecfdf5"/>
    <text x="626" y="209" font-size="16" fill="#334155">14:32</text>
    <text x="766" y="209" font-size="16" font-weight="700" fill="#047857">¥1,200</text>
    <text x="860" y="209" font-size="15" fill="#64748b">No.001</text>
  </g>
  <g>
    <rect x="608" y="240" width="324" height="50" rx="8" fill="#ecfdf5"/>
    <text x="626" y="271" font-size="16" fill="#334155">15:10</text>
    <text x="778" y="271" font-size="16" font-weight="700" fill="#047857">¥800</text>
    <text x="860" y="271" font-size="15" fill="#64748b">No.002</text>
  </g>
  <g>
    <rect x="608" y="302" width="324" height="50" rx="8" fill="#ecfdf5"/>
    <text x="626" y="333" font-size="16" fill="#334155">16:48</text>
    <text x="766" y="333" font-size="16" font-weight="700" fill="#047857">¥3,500</text>
    <text x="860" y="333" font-size="15" fill="#64748b">No.003</text>
