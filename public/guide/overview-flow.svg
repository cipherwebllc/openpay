<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="POSレジ→OpenPay→突合 の全体像">
  <style>text{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;}</style>
  <rect width="1000" height="320" fill="#ffffff"/>
  <!-- card 1: POS -->
  <rect x="30" y="56" width="250" height="208" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="95" y="92" width="120" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <rect x="110" y="104" width="90" height="30" rx="4" fill="#a7f3d0"/>
  <circle cx="126" cy="153" r="7" fill="#059669"/><circle cx="155" cy="153" r="7" fill="#059669"/><circle cx="184" cy="153" r="7" fill="#059669"/>
  <text x="155" y="210" font-size="23" font-weight="700" fill="#047857" text-anchor="middle">POSレジ</text>
  <text x="155" y="238" font-size="15" fill="#475569" text-anchor="middle">売上を記録</text>
  <!-- arrow -->
  <line x1="292" y1="160" x2="356" y2="160" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <polygon points="354,150 372,160 354,170" fill="#059669"/>
  <!-- card 2: OpenPay -->
  <rect x="375" y="56" width="250" height="208" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="455" y="90" width="90" height="84" rx="10" fill="#0f172a"/>
  <rect x="465" y="100" width="70" height="64" rx="6" fill="#ffffff"/>
  <g fill="#047857"><rect x="474" y="109" width="18" height="18" rx="3"/><rect x="508" y="109" width="18" height="18" rx="3"/><rect x="474" y="139" width="18" height="18" rx="3"/></g>
  <g fill="#10b981"><rect x="510" y="141" width="13" height="13"/><rect x="527" y="139" width="8" height="8"/></g>
  <text x="500" y="210" font-size="23" font-weight="700" fill="#047857" text-anchor="middle">OpenPay</text>
  <text x="500" y="238" font-size="15" fill="#475569" text-anchor="middle">JPYC を受け取る</text>
  <!-- arrow -->
  <line x1="637" y1="160" x2="701" y2="160" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <polygon points="699,150 717,160 699,170" fill="#059669"/>
  <!-- card 3: reconcile -->
  <rect x="720" y="56" width="250" height="208" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="800" y="92" width="92" height="82" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <g stroke="#059669" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="811,118 819,126 834,109"/><polyline points="811,150 819,158 834,141"/></g>
  <line x1="846" y1="119" x2="880" y2="119" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
  <line x1="846" y1="151" x2="880" y2="151" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
  <text x="846" y="210" font-size="23" font-weight="700" fill="#0f172a" text-anchor="middle">閉店後に突合</text>
  <text x="846" y="238" font-size="15" fill="#475569" text-anchor="middle">金額・番号で照合</text>
</svg>
