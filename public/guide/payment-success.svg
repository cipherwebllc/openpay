<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 720" width="420" height="720" role="img" aria-label="スマホに「支払い完了」と緑のチェックが表示された画面">
  <style>text{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;}</style>
  <rect width="420" height="720" rx="28" fill="#f8fafc"/>
  <rect x="66" y="58" width="288" height="604" rx="46" fill="#ffffff" stroke="#0f172a" stroke-width="8"/>
  <rect x="170" y="80" width="80" height="14" rx="7" fill="#0f172a"/>
  <circle cx="210" cy="304" r="92" fill="#10b981"/>
