<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 720" width="420" height="720" role="img" aria-label="お客様のスマホに表示される支払い完了画面（緑の全画面に大きなチェックと金額）">
  <style>text{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;}</style>
  <rect width="420" height="720" rx="28" fill="#f8fafc"/>
  <!-- スマホ枠 (お客様の端末) -->
  <rect x="66" y="58" width="288" height="604" rx="46" fill="#0f172a"/>
  <!-- 完了オーバーレイ画面 (実画面と同じく emerald 全面・白文字) -->
  <rect x="78" y="70" width="264" height="580" rx="38" fill="#10b981"/>
  <rect x="176" y="84" width="68" height="12" rx="6" fill="#0f172a"/>
  <!-- 完了音トグル (右上・実画面と同様) -->
  <circle cx="312" cy="118" r="18" fill="#ffffff" fill-opacity="0.18"/>
  <g transform="translate(304,109)">
    <path d="M0 6 h5 l6 -5 v17 l-6 -5 h-5 z" fill="#ffffff"/>
    <path d="M14 5 a7 7 0 0 1 0 11" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <!-- 白丸 + 緑チェック -->
  <circle cx="210" cy="252" r="54" fill="#ffffff"/>
  <path d="M184 253 l18 19 l33 -40" fill="none" stroke="#059669" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 支払い完了 (白・特大) -->
  <text x="210" y="362" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">支払い完了</text>
  <!-- 金額ラベル + 巨大金額 (店主が遠くから視認できるサイズ・実画面準拠) -->
  <text x="210" y="436" font-size="14" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">金額</text>
  <text x="210" y="502" font-size="60" font-weight="800" fill="#ffffff" text-anchor="middle">¥1,200</text>
  <text x="210" y="540" font-size="18" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">JPYC</text>
</svg>
